name: Release PPH 6.0.2
on:
  push:
    paths:
      - 'src/v6.0.2/**'
      - '.github/workflows/release-v6.0.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-tk xvfb
      - name: Build and validate
        run: python3 src/v6.0.2/build_release.py
      - name: Publish stable package
        run: |
          git config user.name 'PPH Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/v6.0.2 channels/stable.json
          git diff --cached --quiet || git commit -m 'Publish PPH 6.0.2 Access Point live data fix'
          git push
