name: Release PPH 3.1.7

on:
  push:
    paths:
      - 'src/v3.1.7/**'
      - '.github/workflows/release-v3.1.7.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate
        run: python3 src/v3.1.7/build_release.py
      - name: Publish stable package
        run: |
          git config user.name "PPH Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/v3.1.7 channels/stable.json
          git commit -m "Release PPH 3.1.7 Display Layer Fix" || exit 0
          git push
