name: Release PPH 4.0.0

on:
  push:
    paths:
      - 'src/v4.0.0/**'
      - '.github/workflows/release-v4.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate
        run: python3 src/v4.0.0/build_release.py
      - name: Publish stable package
        run: |
          git config user.name "PPH Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/v4.0.0 channels/stable.json
          git commit -m "Release PPH 4.0.0 Visual Overhaul" || exit 0
          git push
