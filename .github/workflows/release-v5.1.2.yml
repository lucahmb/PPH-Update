name: Release PPH 5.1.2
on:
  push:
    paths:
      - 'src/v5.1.2/**'
      - '.github/workflows/release-v5.1.2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate
        run: python3 src/v5.1.2/build_release.py
      - name: Publish stable package
        run: |
          git config user.name 'PPH Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/v5.1.2 channels/stable.json
          git diff --cached --quiet || git commit -m 'Publish PPH 5.1.2 startup crash fix'
          git push
