name: Build PPH 3.1 Access Point

on:
  push:
    paths:
      - '.github/workflows/build-v3.1-access-point.yml'
      - 'src/v3.1.0/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v3.1.0 package from v3.0.0
        run: |
          set -euo pipefail
          BASE="packages/v3.0.0/pph-update-3.0.0-control-center.tar.gz"
          WORK="/tmp/pph310"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          tar -xzf "$BASE" -C "$WORK"
          cp src/v3.1.0/access_point.py "$WORK/payload/pph_hub/access_point.py"

          python3 - "$WORK/payload/pph_hub/pph3_ui.py" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding='utf-8')
          text = text.replace('PPH 3.0 shell', 'PPH 3.1 shell', 1)
          text = text.replace('text="3.0"', 'text="3.1"', 1)
          text = text.replace('text="PPH 3.0 SETTINGS"', 'text="PPH 3.1 SETTINGS"', 1)

          anchor = '    from hardware_roles import adapter_overview\n\n    import pph_snapshot\n'
          replacement = '    from hardware_roles import adapter_overview\n    from access_point import AccessPointController, bars_for_speed\n\n    import pph_snapshot\n'
          if anchor not in text:
              raise SystemExit('Import anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '            ("WIFI", "wifi3"),\n            ("SYSTEM", "system3"),\n'
          replacement = '            ("WIFI", "wifi3"),\n            ("ACCESS", "access3"),\n            ("SYSTEM", "system3"),\n'
          if anchor not in text:
              raise SystemExit('Navigation anchor missing')
          text = text.replace(anchor, replacement, 1)

          text = text.replace(
              '("WIFI OVERVIEW", lambda: self.show_page("wifi3"), SURFACE2),',
              '("ACCESS POINT", lambda: self.show_page("access3"), ORANGE),',
              1,
          )

          access_block = r'''
    def build_access(self) -> None:
        page = self._new_page("access3", "ACCESS POINT")
        if not hasattr(self, "pph31_ap"):
            self.pph31_ap = AccessPointController()
        self.pph31_ap_vars = {
            key: tk.StringVar(value="—")
            for key in ("status", "speed", "clients", "detail", "token")
        }
        self.pph31_ap_vars["token"].set(self.pph31_ap.token)

        cards = tk.Frame(page, bg=BG)
        cards.pack(fill="x", padx=10, pady=(8, 4))
        for col in range(2):
            cards.grid_columnconfigure(col, weight=1, uniform="accesscards")

        speed_card = tk.Frame(cards, bg=SURFACE, highlightthickness=1, highlightbackground=BORDER)
        speed_card.grid(row=0, column=0, sticky="nsew", padx=3)
        tk.Frame(speed_card, bg=ORANGE, height=4).pack(fill="x")
        body = tk.Frame(speed_card, bg=SURFACE)
        body.pack(fill="both", expand=True, padx=12, pady=7)
        tk.Label(body, text="AKTUELLE GESCHWINDIGKEIT", bg=SURFACE, fg=MUTED, font=self._font(8, "bold"), anchor="w").pack(fill="x")
        tk.Label(body, textvariable=self.pph31_ap_vars["speed"], bg=SURFACE, fg=ORANGE, font=self._font(19, "bold"), anchor="w").pack(side="left", fill="x", expand=True)
        self.pph31_ap_canvas = tk.Canvas(body, width=145, height=62, bg=SURFACE, highlightthickness=0)
        self.pph31_ap_canvas.pack(side="right", padx=(8, 0))

        client_card = tk.Frame(cards, bg=SURFACE, highlightthickness=1, highlightbackground=BORDER)
        client_card.grid(row=0, column=1, sticky="nsew", padx=3)
        tk.Frame(client_card, bg=CYAN, height=4).pack(fill="x")
        body2 = tk.Frame(client_card, bg=SURFACE)
        body2.pack(fill="both", expand=True, padx=12, pady=7)
        tk.Label(body2, text="VERBUNDENE GERÄTE", bg=SURFACE, fg=MUTED, font=self._font(8, "bold"), anchor="w").pack(fill="x")
        tk.Label(body2, textvariable=self.pph31_ap_vars["clients"], bg=SURFACE, fg=CYAN, font=self._font(22, "bold"), anchor="w").pack(anchor="w")
        tk.Label(body2, textvariable=self.pph31_ap_vars["status"], bg=SURFACE, fg=TEXT, font=self._font(8, "bold"), anchor="w").pack(fill="x")

        config = tk.Frame(page, bg=SURFACE, highlightthickness=1, highlightbackground=BORDER)
        config.pack(fill="x", padx=13, pady=4)
        row = tk.Frame(config, bg=SURFACE)
        row.pack(fill="x", padx=9, pady=7)
        tk.Label(row, text="SSID", bg=SURFACE, fg=MUTED, font=self._font(8, "bold")).grid(row=0, column=0, sticky="w")
        tk.Label(row, text="NEUES PASSWORT", bg=SURFACE, fg=MUTED, font=self._font(8, "bold")).grid(row=0, column=1, sticky="w", padx=(8, 0))
        self.pph31_ap_ssid = tk.Entry(row, bg=SURFACE2, fg=TEXT, insertbackground=TEXT, relief="flat", font=self._font(10))
        self.pph31_ap_password = tk.Entry(row, bg=SURFACE2, fg=TEXT, insertbackground=TEXT, relief="flat", show="•", font=self._font(10))
        self.pph31_ap_ssid.grid(row=1, column=0, sticky="ew", ipady=6)
        self.pph31_ap_password.grid(row=1, column=1, sticky="ew", padx=(8, 0), ipady=6)
        row.grid_columnconfigure(0, weight=1)
        row.grid_columnconfigure(1, weight=1)
        self.pph31_ap_band = tk.StringVar(value=str(self.pph31_ap.config.get("band") or "a"))
        bandrow = tk.Frame(config, bg=SURFACE)
        bandrow.pack(fill="x", padx=9, pady=(0, 7))
        for label, value in (("5 GHz", "a"), ("2.4 GHz", "bg")):
            tk.Radiobutton(bandrow, text=label, value=value, variable=self.pph31_ap_band, indicatoron=False, bg=SURFACE2, fg=TEXT, selectcolor=CYAN, activebackground=CYAN, relief="flat", font=self._font(8, "bold"), padx=10, pady=5).pack(side="left", padx=(0, 5))
        self._button(bandrow, "SPEICHERN", self.pph31_save_access, bg=PURPLE, active=CYAN, size=8, pady=5).pack(side="right")

        actions = tk.Frame(page, bg=BG)
        actions.pack(fill="x", padx=10, pady=3)
        for col in range(4):
            actions.grid_columnconfigure(col, weight=1, uniform="accessactions")
        defs = [
            ("STARTEN", self.pph31_start_access, GREEN),
            ("STOPPEN", self.pph31_stop_access, RED),
            ("TOKEN ANZEIGEN", self.pph31_show_token, SURFACE2),
            ("WIFI OVERVIEW", lambda: self.show_page("wifi3"), SURFACE2),
        ]
        for col, (label, command, accent) in enumerate(defs):
            self._button(actions, label, command, bg=accent, active=CYAN, size=8, pady=6).grid(row=0, column=col, sticky="ew", padx=3)
        tk.Label(page, textvariable=self.pph31_ap_vars["detail"], bg=BG, fg=MUTED, font=self._font(8), anchor="w").pack(fill="x", padx=14, pady=(2, 0))

        current_ssid = str(self.pph31_ap.config.get("ssid") or "PPH-WIFI")
        self.pph31_ap_ssid.insert(0, current_ssid)

    def draw_access_bars(self, count: int) -> None:
        canvas = self.pph31_ap_canvas
        canvas.delete("all")
        for index, height in enumerate((14, 27, 41, 56)):
            x = 10 + index * 31
            y = 59 - height
            fill = ORANGE if index < count else SURFACE3
            canvas.create_rectangle(x, y, x + 20, 59, fill=fill, outline=fill)

    def refresh_access(self) -> None:
        status = self.pph31_ap.status()
        speed = float(status.get("total_mbps") or 0.0)
        active = bool(status.get("active"))
        self.pph31_ap_vars["status"].set(("● AKTIV" if active else "○ AUS") + f" · {status.get('ssid') or 'PPH-WIFI'} · {status.get('band') or '—'}")
        self.pph31_ap_vars["speed"].set(f"{speed:.1f} Mbit/s")
        self.pph31_ap_vars["clients"].set(str(status.get("clients") or 0))
        lan = "LAN verbunden" if status.get("lan_connected") else "LAN getrennt"
        self.pph31_ap_vars["detail"].set(f"{lan} · RX {float(status.get('rx_mbps') or 0):.1f} · TX {float(status.get('tx_mbps') or 0):.1f} Mbit/s · BrosTrend {status.get('wifi_iface') or 'nicht gefunden'}")
        draw_access_bars(self, bars_for_speed(speed))
        if self.current_page == "access3":
            try:
                self.root.after(1000, self.pph31_refresh_access)
            except tk.TclError:
                pass

    def start_access(self) -> None:
        try:
            self.pph31_ap.start()
            self.footer_var.set("Access Point gestartet")
            self.pph31_refresh_access()
        except Exception as exc:
            messagebox.showerror("PPH Access Point", str(exc), parent=self.root)

    def stop_access(self) -> None:
        try:
            self.pph31_ap.stop()
            self.footer_var.set("Access Point gestoppt")
            self.pph31_refresh_access()
        except Exception as exc:
            messagebox.showerror("PPH Access Point", str(exc), parent=self.root)

    def save_access(self) -> None:
        try:
            password = self.pph31_ap_password.get()
            self.pph31_ap.update_config(
                ssid=self.pph31_ap_ssid.get(),
                password=password if password else None,
                band=self.pph31_ap_band.get(),
            )
            self.pph31_ap_password.delete(0, "end")
            self.footer_var.set("Access-Point-Konfiguration gespeichert")
            self.pph31_refresh_access()
        except Exception as exc:
            messagebox.showerror("PPH Access Point", str(exc), parent=self.root)

    def show_access_token(self) -> None:
        messagebox.showinfo("PPH Laptop Token", f"Host: homelab.local:8788\n\nToken:\n{self.pph31_ap.token}", parent=self.root)

'''
          anchor = '    def build_system(self) -> None:\n'
          if anchor not in text:
              raise SystemExit('build_system anchor missing')
          text = text.replace(anchor, access_block + anchor, 1)

          anchor = '        build_wifi(self)\n        build_system(self)\n'
          replacement = '        build_wifi(self)\n        build_access(self)\n        build_system(self)\n'
          if anchor not in text:
              raise SystemExit('build_pages anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '        elif name == "system3":\n            self.pph30_refresh_system()\n'
          replacement = '        elif name == "access3":\n            self.pph31_refresh_access()\n        elif name == "system3":\n            self.pph30_refresh_system()\n'
          if anchor not in text:
              raise SystemExit('show_page anchor missing')
          text = text.replace(anchor, replacement, 1)

          anchor = '    cls.pph30_refresh_wifi = refresh_wifi\n    cls.pph30_refresh_system = refresh_system\n'
          replacement = '''    cls.pph30_refresh_wifi = refresh_wifi
    cls.pph31_refresh_access = refresh_access
    cls.pph31_draw_access_bars = draw_access_bars
    cls.pph31_start_access = start_access
    cls.pph31_stop_access = stop_access
    cls.pph31_save_access = save_access
    cls.pph31_show_token = show_access_token
    cls.pph30_refresh_system = refresh_system
'''
          if anchor not in text:
              raise SystemExit('class assignment anchor missing')
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

          cat > "$WORK/payload/pph_version.py" <<'PY'
          from __future__ import annotations

          VERSION = "3.1.0"
          CHANNEL = "stable"
          BUILD_NAME = "PPH 3.1.0 · Access Point"
          SCHEMA_VERSION = 3
          PY

          cat > "$WORK/payload/test_access_point_310.py" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parent
          HUB = ROOT / "pph_hub"
          sys.path.insert(0, str(HUB))
          from access_point import bars_for_speed

          assert bars_for_speed(0.0) == 0
          assert bars_for_speed(1.0) == 1
          assert bars_for_speed(10.0) == 2
          assert bars_for_speed(50.0) == 3
          assert bars_for_speed(100.0) == 4
          ui = (HUB / "pph3_ui.py").read_text(encoding="utf-8")
          assert '("ACCESS", "access3")' in ui
          assert 'AccessPointController' in ui
          print("PPH 3.1 access point tests OK")
          PY

          python3 -m py_compile "$WORK/payload/pph_hub/access_point.py" "$WORK/payload/pph_hub/pph3_ui.py" "$WORK/payload/pph_hub/pph3_app.py"
          (cd "$WORK/payload" && python3 test_access_point_310.py)

          python3 - "$WORK" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          payload = root / 'payload'
          files = []
          for path in sorted(p for p in payload.rglob('*') if p.is_file() and '__pycache__' not in p.parts and p.suffix != '.pyc'):
              rel = path.relative_to(payload).as_posix()
              sha = hashlib.sha256(path.read_bytes()).hexdigest()
              mode = '0755' if rel in {'start_pph_hub.sh', 'pph_hub/pph3_app.py'} else '0644'
              files.append({'path': rel, 'sha256': sha, 'mode': mode})
          manifest = {
              'format': 1,
              'product': 'pph-funktest',
              'version': '3.1.0',
              'min_version': '3.0.0',
              'max_version': '3.0.99',
              'channel': 'stable',
              'build_name': 'PPH 3.1.0 · Access Point',
              'released': '2026-08-10',
              'tests': ['test_v2.py', 'test_measurement_targets.py', 'test_core_platform_28.py', 'test_github_updates_29.py', 'test_ui_300.py', 'test_access_point_310.py'],
              'features': [
                  'Neuer ACCESS-Point-Tab im PPH 3 Control Center',
                  'LAN-Uplink wird über BrosTrend mt7921u als eigenes WLAN bereitgestellt',
                  'Eigene SSID und WPA2-Passwort direkt am Touchdisplay konfigurierbar',
                  '2.4-GHz- und 5-GHz-Modus auswählbar',
                  'Live-Anzeige für Gesamtgeschwindigkeit, RX, TX und verbundene Geräte',
                  'Vier dynamische WLAN-Balken abhängig vom aktuellen Datendurchsatz',
                  'Lokale Laptop-Steuerung über token-geschützte API auf TCP 8788',
                  'Keine feste wlan0/wlan1/wlan2-Zuordnung; BrosTrend wird über mt7921u erkannt',
                  'Offline-Betrieb nach Installation; Internet wird nur für PPH-Versionsupdates benötigt'
              ],
              'files': files,
          }
          (root / 'manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm -rf "$WORK/payload/pph_hub/__pycache__"
          mkdir -p packages/v3.1.0
          tar -czf packages/v3.1.0/pph-update-3.1.0-access-point.tar.gz -C "$WORK" manifest.json payload
          SHA="$(sha256sum packages/v3.1.0/pph-update-3.1.0-access-point.tar.gz | awk '{print $1}')"
          python3 - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          stable = {
              'product': 'pph-funktest',
              'channel': 'stable',
              'version': '3.1.0',
              'released': '2026-08-10',
              'build_name': 'PPH 3.1.0 · Access Point',
              'repository': 'lucahmb/PPH-Update',
              'package_url': 'https://raw.githubusercontent.com/lucahmb/PPH-Update/main/packages/v3.1.0/pph-update-3.1.0-access-point.tar.gz',
              'sha256': sha,
              'min_version': '3.0.0',
              'max_version': '3.0.99',
              'notes': [
                  'ACCESS POINT direkt im PPH 3 Control Center',
                  'LAN -> BrosTrend mt7921u -> eigenes WLAN mit eigener SSID und Passwort',
                  'Live Mbit/s, RX/TX, Client-Anzahl und dynamische WLAN-Balken',
                  '2.4/5 GHz Auswahl und Start/Stop am Touchdisplay',
                  'Laptop-Steuerung lokal über Port 8788 und Token',
                  'Keine feste wlanX-Bindung'
              ],
          }
          open('channels/stable.json', 'w', encoding='utf-8').write(json.dumps(stable, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Commit v3.1.0 stable package
        run: |
          git config user.name 'PPH Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add packages/v3.1.0 channels/stable.json
          git commit -m 'Release PPH 3.1.0 Access Point' || exit 0
          git push
